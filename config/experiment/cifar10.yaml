# @package _global_

defaults:
  - override /dataset: cifar10
  - override /model/scheduler: flow_matching
  - override /model/denoiser: songunet
  - override /model/noise_predictor: unet_class_cond

trainer:
  val_check_interval: 2331
  max_steps: 500_000

model:
  aux_losses:
    - name: kl_divergence_gaussian
      weight: 0.00001
  use_noise_predictor: true
  noise_predictor:
    input_mode: sample_only
    gaussian: true
    gaussian_mode: mean_var


train:
  use_ema: true
  ema_decay: 0.9999
  activate_w_mode: true
  interpolate_distrubutions: true

optimizer:
  name: Adam
  lr: 0.0002
  scheduler:
    name: constant_with_warmup
    num_warmup_steps: 5000

data_loader:
  train:
    batch_size: 128
  val:
    batch_size: 512
  test:
    batch_size: 512

wandb:
  project: diffusion-cifar10
